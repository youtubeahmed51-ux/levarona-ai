 <!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Levarona AI - Eight-Subject Tutor</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--text:#f8fafc;--muted:#94a3b8;--primary:#6366f1;--primary-hover:#4f46e5;--line:#334155;--accent:#38bdf8}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
.app{width:100%;max-width:840px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:12px;background:var(--panel);padding:14px 18px;border-radius:14px;border:1px solid var(--line)}
.logo{width:42px;height:42px;background:var(--primary);color:#fff;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center;border-radius:10px}
header h1{font-size:20px;font-weight:700}
header p{font-size:13px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:12px}
.controls label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.controls select{width:100%;padding:8px 10px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--bg);color:var(--text);border:1px solid var(--line);padding:6px 12px;border-radius:20px;font-size:13px;cursor:pointer;transition:background .2s,border-color .2s}
.chip:hover{background:var(--line);border-color:var(--primary)}
.status{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tag{background:var(--bg);padding:3px 8px;border-radius:6px;border:1px solid var(--line)}
.chat{height:420px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:12px;background:var(--bg);border-radius:10px;border:1px solid var(--line)}
.msg{padding:10px 14px;border-radius:12px;max-width:85%;line-height:1.5;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{background:var(--primary);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg.bot{background:var(--panel);color:var(--text);align-self:flex-start;border:1px solid var(--line);border-bottom-left-radius:4px}
.composer{display:flex;gap:8px;margin-top:12px}
.composer textarea{flex:1;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;resize:none;height:48px}
.composer textarea:focus{outline:none;border-color:var(--primary)}
.send{background:var(--primary);color:#fff;border:0;padding:0 20px;border-radius:10px;font-weight:600;cursor:pointer;transition:background .2s}
.send:hover{background:var(--primary-hover)}
.send:disabled{opacity:.65;cursor:wait}
</style>
</head>
<body>
<main class="app">
<header>
<div class="logo">L</div>
<div>
<h1>Levarona AI</h1>
<p>Eight-subject tutor · Connected live AI</p>
</div>
</header>
<section class="panel">
<div class="controls">
<div>
<label for="subject">Subject / المادة</label>
<select id="subject">
<option>Mathematics</option>
<option>Physics</option>
<option>Chemistry</option>
<option>Biology</option>
<option>English</option>
<option>French</option>
<option>German</option>
<option>Arabic</option>
<option>General</option>
</select>
</div>
<div>
<label for="level">Learning level / المستوى</label>
<select id="level">
<option>Start from zero</option>
<option>Beginner</option>
<option>Intermediate</option>
<option>Advanced</option>
<option>University</option>
</select>
</div>
<div>
<label for="mode">What do you need?</label>
<select id="mode">
<option>Explain</option>
<option>Practice</option>
<option>Quiz</option>
</select>
</div>
</div>
<div class="chips">
<button class="chip" type="button" onclick="quick('Explain the current topic from the beginning with examples')">Explain from zero</button>
<button class="chip" type="button" onclick="quick('Give me practice questions with answers')">Practice + answers</button>
<button class="chip" type="button" onclick="quick('Quiz me on this subject')">Quiz me</button>
</div>
</section>

<section id="chat" class="panel chat" aria-live="polite">
<div class="msg bot">Hi! 👋 أنا Levarona، مدرسك الذكي. اسألني عن أي درس أو مادة وسأقوم بمساعدتك فوراً.</div>
</section>

<form class="composer" id="form">
<textarea id="prompt" placeholder="اكتب سؤالك بالعربي أو English…" required></textarea>
<button class="send" id="sendBtn" type="submit">Send</button>
</form>
</main>

<script>
const chatHistory = [];

document.getElementById('form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const promptInput = document.getElementById('prompt');
    const sendBtn = document.getElementById('sendBtn');
    const userText = promptInput.value.trim();
    if (!userText) return;

    const subject = document.getElementById('subject').value;
    const level = document.getElementById('level').value;
    const mode = document.getElementById('mode').value;

    // إظهار رسالة المستخدم
    appendMessage("user", userText);
    chatHistory.push({ role: "user", content: userText });
    promptInput.value = "";

    // إظهار مؤشر الانتظار
    const loadingMsg = appendMessage("bot", "⏳ جارِ التفكير والبحث...");
    sendBtn.disabled = true;

    try {
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                message: userText,
                subject: subject,
                level: level,
                mode: mode,
                history: chatHistory
            })
        });

        const data = await response.json();
        loadingMsg.remove();

        if (response.ok && data.reply) {
            appendMessage("bot", data.reply);
            chatHistory.push({ role: "assistant", content: data.reply });
        } else {
            appendMessage("bot", "⚠️ " + (data.error || "حدث خطأ غير متوقع."));
        }
    } catch (error) {
        loadingMsg.remove();
        appendMessage("bot", "⚠️ خطأ في الاتصال بالخادم.");
    } finally {
        sendBtn.disabled = false;
    }
});

function appendMessage(sender, text) {
    const chatBox = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = `msg ${sender}`;
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
}

function quick(text) {
    document.getElementById('prompt').value = text;
    document.getElementById('form').dispatchEvent(new Event('submit'));
}
</script>
</body>
</html>
